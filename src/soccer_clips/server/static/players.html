<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer Clips — Players</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/common.css">
<style>
  .main { padding: 12px 16px; }
  .intro { color: var(--muted); line-height: 1.7; margin-bottom: 10px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; }
  .tile { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 6px;
          cursor: pointer; user-select: none; }
  .tile:hover { border-color: #666; }
  .tile .pics { height: 120px; display: flex; justify-content: center; align-items: center; background: #000; border-radius: 3px;
                overflow: hidden; }
  .tile img { max-width: 100%; max-height: 120px; display: block; }
  .tile .none { color: var(--muted); font-size: 12px; }
  .tile .cap { display: flex; gap: 6px; align-items: baseline; margin-top: 4px; font-size: 12px; color: var(--muted);
               font-variant-numeric: tabular-nums; }
  .tile .cap a { margin-left: auto; text-decoration: none; }
  .tile .mark { position: absolute; top: 8px; left: 8px; font-size: 22px; font-weight: 700; text-shadow: 0 0 4px #000, 0 0 2px #000; }
  .tile.yes .mark { color: var(--in); }
  .tile.no { border-color: var(--bad); }
  .tile.no .mark { color: var(--bad); }
  .tile.no .pics { opacity: 0.45; }
  .tile.skip { border-style: dashed; }
  .tile.skip .mark { color: var(--muted); }
  .tile.skip .pics { opacity: 0.6; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .placeholder { padding: 48px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="bar">
  <a href="/" title="Back to the tagger">← Tagger</a>
  <select id="game" aria-label="game" title="Which game's players to sort"></select>
  <select id="player" aria-label="player" title="Who you're checking: every tile asks &quot;is this them?&quot;"></select>
  <select id="mode" aria-label="what to check" title="Which tracklets to show">
    <option value="auto">automatic guesses (least sure first)</option>
    <option value="like">look-alikes (best match first)</option>
    <option value="labelled">already labelled (least like them first)</option>
  </select>
  <span class="stat" id="count" title="Tiles on this page / left to check"></span>
  <button id="save" title="Save this page (Enter): ✓ tiles are this player, ✗ tiles aren't; ? tiles are left for later">Save page <kbd>Enter</kbd></button>
  <button id="undo" title="Take back the last page you saved (U)" disabled>Undo last save <kbd>U</kbd></button>
  <span id="flash"></span>
</div>
<div class="main">
  <div class="intro" id="intro"></div>
  <div id="grid"></div>
  <div class="placeholder" id="empty" hidden></div>
  <div class="row" id="pageRow" hidden>
    <button id="save2" title="Save this page (Enter)">Save page <kbd>Enter</kbd></button>
    <span class="stat">Every tile is ✓ unless you mark it. Click or <kbd>X</kbd> = ✗ not them · right-click or <kbd>S</kbd> = ? can't tell (left for later) · <kbd>A</kbd> = all ✗ ·
      <kbd>▶</kbd> opens it in the tagger</span>
  </div>
</div>

<script src="/static/common.js"></script>
<script>
// "Is this #N?" for a page of tracklets at a time. Each tile: crops from the start, middle and end of the
// stretch (a swap to another girl shows up as different pictures). Saving labels the ✓ tiles as the player
// and turns down the ✗ ones, as Y / X do in the tagger.
const PAGE = 24;
let games = [], game = null, fps = 30000 / 1001, player = null, mode = "auto";
let items = [];  // candidates still to check, in order: {track, start, end, frame, note, labelled}
const marks = new Map();  // key -> "no" | "skip" (no entry: yes)
const reviewed = new Set();  // keys answered here (labelled stretches stay in the lists, so they're kept out here)
const later = new Set();  // keys left with ? on a saved page: shown again after everything else
const saves = [];  // [{gameId, batch, keys}] for undo
let hovered = null, loading = 0;

const keyOf = (it) => `${game.id}:${player}:${it.track}:${it.start}`;
const pageItems = () => items.slice(0, PAGE);

async function init() {
  const [gs, settings] = await Promise.all([getJson("/api/games"), getJson("/api/settings")]);
  games = gs.sort((a, b) => (b.played_on || "").localeCompare(a.played_on || ""));
  const h = readHash();
  for (const g of games) $("game").append(new Option(shortGame(g.id), g.id));
  const nums = [...new Set([...(settings.roster || []), settings.default_player].filter((n) => n != null))].sort((a, b) => a - b);
  for (const n of nums) $("player").append(new Option(`is this #${n}?`, n));
  $("game").value = games.some((g) => g.id === h.game) ? h.game : games[0]?.id;
  $("player").value = nums.includes(+h.player) ? +h.player : settings.default_player ?? nums[0];
  $("mode").value = ["auto", "like", "labelled"].includes(h.mode) ? h.mode : "auto";
  await load();
}

async function load() {
  game = games.find((g) => g.id === $("game").value);
  player = +$("player").value;
  mode = $("mode").value;
  history.replaceState(null, "", makeHash({ game: game.id, player, mode }));
  fps = game.fps_num / game.fps_den;
  const id = encodeURIComponent(game.id), ticket = ++loading;
  $("grid").innerHTML = "";
  $("empty").hidden = false;
  $("empty").textContent = "finding them… (the first time in a game takes a few seconds)";
  $("pageRow").hidden = true;
  let got = [];
  try {
    if (mode === "auto") {
      const a = await getJson(`/api/games/${id}/people/auto`);
      // margin: how far ahead of the next most alike teammate on screen (null: nobody else on screen)
      const lead = (x) => x.margin ?? Infinity;
      got = (a[player] || []).map((x) => ({ ...x, note: x.margin == null ? "alone" : `lead ${x.margin.toFixed(2)}` }))
        .sort((p, q) => lead(p) - lead(q));
    } else if (mode === "like") {
      const r = await getJson(`/api/games/${id}/people/suggest?player=${player}&limit=200`);
      if (r.note) throw new Error(r.note);
      got = r.suggestions.map((x) => ({ ...x, note: `like ${x.score.toFixed(2)}` }));
    } else {
      const r = await getJson(`/api/games/${id}/people/labelled?player=${player}`);
      got = r.stretches.map((x) => ({ ...x, labelled: true, note: x.score == null ? "" : `like ${x.score.toFixed(2)}` }));
    }
  } catch (e) {
    if (ticket !== loading) return;
    $("empty").textContent = String(e.message || e);
    return;
  }
  if (ticket !== loading) return;
  got = got.filter((it) => !reviewed.has(keyOf(it)));
  items = [...got.filter((it) => !later.has(keyOf(it))), ...got.filter((it) => later.has(keyOf(it)))];
  render();
}

function render() {
  const page = pageItems();
  const intro = {
    auto: `Where #${player} was placed automatically by appearance and not yet labelled. Least sure first.`,
    like: `Unlabelled teammates who look most like #${player}, best match first: expect more ✗ further down.`,
    labelled: `Stretches already labelled #${player}, least like her other labels first: a ✗ here removes the label.`,
  }[mode];
  $("intro").textContent = `${intro} Each tile shows the start, middle and end of the stretch; if they're not all the same girl, mark it ✗ (or ? to leave it).`;
  $("count").innerHTML = items.length ? `<b>${page.length}</b> on this page · <b>${items.length}</b> left` : "";
  $("empty").hidden = page.length > 0;
  if (!page.length) $("empty").textContent = {
    auto: `No automatic guesses of #${player} left in this game. Try “look-alikes”.`,
    like: `No more look-alikes of #${player} in this game.`,
    labelled: `No labelled stretches of #${player} left to check in this game.`,
  }[mode];
  $("pageRow").hidden = !page.length;
  $("save").disabled = $("save2").disabled = !page.length;
  $("undo").disabled = !saves.length;
  const id = encodeURIComponent(game.id);
  $("grid").innerHTML = page.map((it, i) => {
    const m = marks.get(keyOf(it)), cls = m === "no" ? "no" : m === "skip" ? "skip" : "yes";
    const t = it.frame / fps, secs = Math.round((it.end - it.start) / fps);
    return `<div class="tile ${cls}" data-i="${i}">
      <div class="pics"><img loading="lazy" alt="" src="/api/games/${id}/people/strip.jpg?track=${it.track}&start=${it.start}&end=${it.end}"
        onerror="this.replaceWith(Object.assign(document.createElement('span'), {className: 'none', textContent: 'no picture (too small)'}))"></div>
      <span class="mark">${cls === "no" ? "✗" : cls === "skip" ? "?" : "✓"}</span>
      <div class="cap"><span>${fmt(t)}</span><span>${secs} s</span><span>${esc(it.note)}</span>
        <a href="/#${makeHash({ game: game.id, t: t.toFixed(2) }).slice(1)}" target="_blank" title="Open in the tagger at this moment">▶</a></div>
    </div>`;
  }).join("");
}

function setMark(i, m) {
  const it = pageItems()[i];
  if (!it) return;
  const k = keyOf(it);
  if (marks.get(k) === m) marks.delete(k); else marks.set(k, m);
  render();
}

$("grid").addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const t = e.target.closest(".tile");
  if (t) setMark(+t.dataset.i, e.shiftKey ? "skip" : "no");
});
$("grid").addEventListener("contextmenu", (e) => {
  const t = e.target.closest(".tile");
  if (!t) return;
  e.preventDefault();
  setMark(+t.dataset.i, "skip");
});
$("grid").addEventListener("mouseover", (e) => { hovered = e.target.closest(".tile")?.dataset.i ?? null; });
$("grid").addEventListener("mouseleave", () => { hovered = null; });

async function savePage() {
  const page = pageItems();
  if (!page.length) return;
  const answer = page.filter((it) => marks.get(keyOf(it)) !== "skip");
  const batch = Date.now().toString(36);
  const r = await api("POST", `/api/games/${encodeURIComponent(game.id)}/people/answers`, {
    player, batch,
    answers: answer.map((it) => ({ track: it.track, frame: it.frame, start: it.start, yes: marks.get(keyOf(it)) !== "no",
                                   labelled: !!it.labelled })),
  });
  const keys = answer.map(keyOf);
  for (const k of keys) { reviewed.add(k); marks.delete(k); }
  for (const it of page) {  // ? tiles go to the back of the list, unmarked
    if (marks.get(keyOf(it)) === "skip") { later.add(keyOf(it)); marks.delete(keyOf(it)); }
  }
  saves.push({ gameId: game.id, batch, keys });
  flash(`saved ${answer.length} (${r.saved} labels changed)`);
  window.scrollTo(0, 0);
  await load();  // the guesses move with every answer
}

async function undoSave() {
  const s = saves.pop();
  if (!s) return;
  const r = await api("DELETE", `/api/games/${encodeURIComponent(s.gameId)}/people/answers/${s.batch}`);
  for (const k of s.keys) reviewed.delete(k);
  flash(`took back the last page (${r.undone} labels)`);
  await load();
}

$("save").addEventListener("click", (e) => { e.currentTarget.blur(); savePage(); });
$("save2").addEventListener("click", (e) => { e.currentTarget.blur(); savePage(); });
$("undo").addEventListener("click", (e) => { e.currentTarget.blur(); undoSave(); });
for (const id of ["game", "player", "mode"]) $(id).addEventListener("change", (e) => { e.target.blur(); load(); });

document.addEventListener("keydown", (e) => {
  if (typingInField(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const act = {
    Enter: savePage,
    u: undoSave,
    x: () => hovered != null && setMark(+hovered, "no"),
    s: () => hovered != null && setMark(+hovered, "skip"),
    a: () => {  // all ✗ (or back to all ✓ if they already are)
      const page = pageItems(), all = page.every((it) => marks.get(keyOf(it)) === "no");
      for (const it of page) all ? marks.delete(keyOf(it)) : marks.set(keyOf(it), "no");
      render();
    },
  }[key];
  if (!act) return;
  e.preventDefault();
  act();
});

init();
</script>
</body>
</html>
