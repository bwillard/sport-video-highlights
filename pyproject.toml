[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer_clips"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.scripts]
soccer-clips = "soccer_clips.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"soccer_clips.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
